.type(Cypress.expose(\&quot;origin\&quot;));\ncy.get(_FlightSearchPage.default.elements.originJakarta).filter(\&quot;:visible\&quot;).first().should(\&quot;be.visible\&quot;).click();\n// Select Singapore as destination\ncy.get(_FlightSearchPage.default.elements.destinationInput).should(\&quot;be.visible\&quot;).clear().type(Cypress.expose(\&quot;destination\&quot;));\ncy.get(_FlightSearchPage.default.elements.destinationSingapore).filter(\&quot;:visible\&quot;).first().should(\&quot;be.visible\&quot;).click();\n// Calculate departure date (H+1)\nconst tomorrow = new Date();\ntomorrow.setDate(tomorrow.getDate() + 1);\nconst day = tomorrow.getDate();\nconst month = tomorrow.toLocaleString(\&quot;en-US\&quot;, {\n  month: \&quot;long\&quot;\n});\nconst year = tomorrow.getFullYear();\nconst ordinal = n =&gt; {\n  if (n &gt;= 11 &amp;&amp; n &lt;= 13) return `${n}th`;\n  switch (n % 10) {\n    case 1:\n      return `${n}st`;\n    case 2:\n      return `${n}nd`;\n    case 3:\n      return `${n}rd`;\n    default:\n      return `${n}th`;\n  }\n};\nconst departureTestId = `${tomorrow.toLocaleDateString(\&quot;en-US\&quot;, {\n  weekday: \&quot;long\&quot;\n})}, ${month} ${ordinal(day)}, ${year}`;\n// Select departure date\nconst departureSelector = `button[data-testid=\&quot;${departureTestId}\&quot;]`;\ncy.get(departureSelector).should(\&quot;be.visible\&quot;).click();\n// Open passenger and cabin class dropdown\ncy.get(_FlightSearchPage.default.elements.passengerSelector).filter(\&quot;:visible\&quot;).first().should(\&quot;be.visible\&quot;).click();\n// Inspect passenger and cabin class elements\ncy.get(\&quot;body\&quot;).then($body =&gt; {\n  const passengerElements = $body.find(&#x27;div[data-component=\&quot;flight-search-occupancy\&quot;]&#x27;);\n  passengerElements.each((index, element) =&gt; {});\n  const cabinButtons = $body.find(&#x27;[data-element-name=\&quot;flight-cabin-class\&quot;]&#x27;);\n  cabinButtons.each((index, button) =&gt; {});\n});\n// Close passenger and cabin class dropdown\ncy.get(_FlightSearchPage.default.elements.passengerSelector).filter(\&quot;:visible\&quot;).first().click();\n// Search for flights\ncy.get(_FlightSearchPage.default.elements.searchButton).should(\&quot;be.visible\&quot;).and(\&quot;contain.text\&quot;, \&quot;SEARCH FLIGHTS\&quot;).click();\n// Wait for the flight results title to update\ncy.get(&#x27;[data-component=\&quot;mob-flight-result-title\&quot;]&#x27;, {\n  timeout: 30000\n}).should(\&quot;be.visible\&quot;).should($title =&gt; {\n  expect($title.text().trim()).to.equal(\&quot;Flights from Jakarta to Singapore\&quot;);\n});\n// Open airline filters\ncy.get(_FlightSearchPage.default.elements.airlinesFilterHeader).should(\&quot;be.visible\&quot;);\ncy.get(_FlightSearchPage.default.elements.showAllAirlines).should(\&quot;be.visible\&quot;).click();\n// Select Malaysia Airlines\ncy.get(_FlightSearchPage.default.elements.malaysiaAirlinesOption).filter(\&quot;:visible\&quot;).should(\&quot;be.visible\&quot;).and(\&quot;have.attr\&quot;, \&quot;aria-selected\&quot;, \&quot;false\&quot;).click();\n// Verify Malaysia Airlines filter is selected\ncy.get(_FlightSearchPage.default.elements.malaysiaAirlinesOption).should(\&quot;have.attr\&quot;, \&quot;aria-selected\&quot;, \&quot;true\&quot;).find(&#x27;input[type=\&quot;checkbox\&quot;]&#x27;).should(\&quot;be.checked\&quot;);\n// Wait for airline flight results\ncy.get(`[data-testid=\&quot;airline-logo\&quot;][alt=\&quot;${Cypress.expose(\&quot;airline\&quot;)}\&quot;]`, {\n  timeout: 30000\n}).should(\&quot;have.length.greaterThan\&quot;, 0);\n// Find unique Malaysia Airlines flights\ncy.get(_FlightSearchPage.default.elements.departureTime).should(\&quot;have.length.greaterThan\&quot;, 0).then($times =&gt; {\n  const uniqueCards = new Set();\n  const flights = [...$times].map(timeElement =&gt; {\n    let card = timeElement.parentElement;\n    // Find the ancestor containing the airline logo\n    while (card &amp;&amp; !card.querySelector(_FlightSearchPage.default.elements.airlineLogo)) {\n      card = card.parentElement;\n    }\n    if (!card || uniqueCards.has(card)) {\n      return null;\n    }\n    const logo = card.querySelector(_FlightSearchPage.default.elements.airlineLogo);\n    const airline = Cypress.expose(\&quot;airline\&quot;);\n    if (!logo || logo.getAttribute(\&quot;alt\&quot;) !== airline) {\n      return null;\n    }\n    uniqueCards.add(card);\n    const departure = timeElement.innerText.trim();\n    const [hours, minutes] = departure.split(\&quot;:\&quot;).map(Number);\n    return {\n      departure,\n      minutes: hours * 60 + minutes,\n      card\n    };\n  }).filter(Boolean).sort((a, b) =&gt; a.minutes - b.minutes);\n  flights.forEach((flight, index) =&gt; {});\n  expect(flights.length).to.be.greaterThan(0);\n  const earliestFlight = flights[0];\n  const departure = earliestFlight.card.querySelector(&#x27;[data-testid=\&quot;departure-time\&quot;]&#x27;).innerText.trim();\n  const arrival = earliestFlight.card.querySelector(&#x27;[data-testid=\&quot;arrival-time\&quot;]&#x27;).innerText.trim();\n  cy.wrap(departure).as(\&quot;selectedDepartureTime\&quot;);\n  cy.wrap(arrival).as(\&quot;selectedArrivalTime\&quot;);\n  // Find the expand button within the selected flight card\n  cy.wrap(earliestFlight.card).find(&#x27;button[aria-label*=\&quot;Expand flight details\&quot;]&#x27;).filter(\&quot;:visible\&quot;).first().should(\&quot;be.visible\&quot;).and(\&quot;have.attr\&quot;, \&quot;aria-expanded\&quot;, \&quot;false\&quot;).click();\n  // Select the expanded Malaysia Airlines flight\n  cy.get(_FlightSearchPage.default.elements.selectFlightButton, {\n    timeout: 15000\n  }).filter(\&quot;:visible\&quot;).should(\&quot;have.length.greaterThan\&quot;, 0).first().should(\&quot;be.enabled\&quot;).click();\n});\n// Handle booking page opened in a new tab\ncy.window().then(win =&gt; {\n  cy.stub(win, \&quot;open\&quot;).callsFake(url =&gt; {\n    win.location.href = url;\n  });\n});\n// Wait for the booking page to load\ncy.get(&#x27;[data-testid=\&quot;flight-card-bookButton\&quot;]&#x27;, {\n  timeout: 30000\n}).should(&#x27;not.exist&#x27;);\n// Verify Contact Details section\ncy.contains(\&quot;h3\&quot;, \&quot;Contact details\&quot;, {\n  timeout: 30000\n}).should(\&quot;be.visible\&quot;);\nconst passengerFirstName = Cypress.expose(\&quot;passengerFirstName\&quot;);\nconst passengerLastName = Cypress.expose(\&quot;passengerLastName\&quot;);\nconst passengerEmail = Cypress.expose(\&quot;passengerEmail\&quot;);\nconst passengerPhone = Cypress.expose(\&quot;passengerPhone\&quot;);\n// Fill Contact Details\ncy.get(_FlightSearchPage.default.elements.firstNameInput).should(\&quot;be.visible\&quot;).and(\&quot;be.enabled\&quot;).clear().type(passengerFirstName);\ncy.get(_FlightSearchPage.default.elements.lastNameInput).should(\&quot;be.visible\&quot;).and(\&quot;be.enabled\&quot;).clear().type(passengerLastName);\ncy.get(_FlightSearchPage.default.elements.emailInput).should(\&quot;be.visible\&quot;).and(\&quot;be.enabled\&quot;).clear().type(passengerEmail);\ncy.get(_FlightSearchPage.default.elements.mobilePhoneInput).should(\&quot;be.visible\&quot;).and(\&quot;be.enabled\&quot;).clear().type(passengerPhone);\n// Select Gender: Female\ncy.get(&#x27;label[data-testid=\&quot;1\&quot;]&#x27;).should(\&quot;be.visible\&quot;).click();\ncy.get(&#x27;input[type=\&quot;radio\&quot;][aria-label=\&quot;Female\&quot;]&#x27;).should(\&quot;be.checked\&quot;);\n// Fill Passenger Given Name\ncy.get(_FlightSearchPage.default.elements.passengerFirstName).should(\&quot;be.visible\&quot;).clear().type(passengerFirstName).should(\&quot;have.value\&quot;, passengerFirstName);\n// Fill Passenger Surname\ncy.get(_FlightSearchPage.default.elements.passengerLastName).should(\&quot;be.visible\&quot;).clear().type(passengerLastName).should(\&quot;have.value\&quot;, passengerLastName);\n// Fill Date of Birth - Day\ncy.get(_FlightSearchPage.default.elements.p
